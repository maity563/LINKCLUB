server:
  port: 9020

spring:
  application:
    name: APIGateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: userService
              uri: lb://USERSERVICE
              predicates:
                - Path=/api/v1/user/**
              filters:
                - AuthenticationFilter

            - id: posts-service
              uri: lb://POSTS-SERVICE
              predicates:
                - Path=/api/v1/post/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,gateway      